<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Open World Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 2;
        }
        #menu button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            background: #007BFF;
            color: white;
            border-radius: 5px;
            transition: background 0.3s;
        }
        #menu button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>Welcome to the 3D Open World Game</h1>
        <button onclick="startGame()">Start Game</button>
        <button onclick="alert('Game Info: Use W, A, S, D to move and mouse to look around.')">How to Play</button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const menu = document.getElementById('menu');
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5).normalize();
        scene.add(light);

        // Create a ground plane
        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMaterial = new THREE.MeshPhongMaterial({ color: 0x228B22 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Add some trees
        const treeMaterial = new THREE.MeshPhongMaterial({ color: 0x8B4513 });
        const leafMaterial = new THREE.MeshPhongMaterial({ color: 0x006400 });

        function createTree(x, z) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2), treeMaterial);
            trunk.position.set(x, 1, z);
            scene.add(trunk);

            const leaves = new THREE.Mesh(new THREE.SphereGeometry(1), leafMaterial);
            leaves.position.set(x, 2.5, z);
            scene.add(leaves);
        }

        for (let i = 0; i < 20; i++) {
            const x = Math.random() * 100 - 50;
            const z = Math.random() * 100 - 50;
            createTree(x, z);
        }

        // Movement variables
        const keys = { w: false, a: false, s: false, d: false };
        const speed = 0.1;

        function handleKeyDown(event) {
            keys[event.key.toLowerCase()] = true;
        }

        function handleKeyUp(event) {
            keys[event.key.toLowerCase()] = false;
        }

        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);

        // Mouse look
        const lookSpeed = 0.002;
        let isPointerLocked = false;

        canvas.addEventListener('click', () => {
            canvas.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === canvas;
        });

        document.addEventListener('mousemove', (event) => {
            if (isPointerLocked) {
                camera.rotation.y -= event.movementX * lookSpeed;
                camera.rotation.x -= event.movementY * lookSpeed;
                camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
            }
        });

        function updateMovement() {
            const forward = new THREE.Vector3(
                -Math.sin(camera.rotation.y),
                0,
                -Math.cos(camera.rotation.y)
            ).normalize();

            const right = new THREE.Vector3(
                Math.cos(camera.rotation.y),
                0,
                -Math.sin(camera.rotation.y)
            ).normalize();

            if (keys.w) camera.position.addScaledVector(forward, speed);
            if (keys.s) camera.position.addScaledVector(forward, -speed);
            if (keys.a) camera.position.addScaledVector(right, -speed);
            if (keys.d) camera.position.addScaledVector(right, speed);
        }

        function animate() {
            updateMovement();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        function startGame() {
            menu.style.display = 'none';
            animate();
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
