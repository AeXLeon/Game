<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Multiplayer Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 2;
        }
        #menu button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            background: #007BFF;
            color: white;
            border-radius: 5px;
            transition: background 0.3s;
        }
        #menu button:hover {
            background: #0056b3;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="menu">
        <h1>Welcome to the 3D Multiplayer Game</h1>
        <button onclick="startGame()">Start Game</button>
        <button onclick="alert('Game Info: Use W, A, S, D to move, SPACE to jump, and mouse to look around.')">How to Play</button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const menu = document.getElementById('menu');
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        const cameraHolder = new THREE.Object3D();
        cameraHolder.add(camera);
        scene.add(cameraHolder);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5).normalize();
        scene.add(light);

        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMaterial = new THREE.MeshPhongMaterial({ color: 0x228B22 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        ground.position.y = 0;
        scene.add(ground);

        const players = {}; // Track all players
        const socket = io();

        socket.on('current-players', (data) => {
            for (const [id, playerData] of Object.entries(data)) {
                if (!players[id]) {
                    addPlayer(id, playerData);
                }
            }
        });

        socket.on('player-joined', (data) => {
            addPlayer(data.id, data);
        });

        socket.on('update-position', (data) => {
            const player = players[data.id];
            if (player) {
                player.position.set(data.x, data.y, data.z);
                player.rotation.y = data.rotationY;
            }
        });

        socket.on('player-left', (id) => {
            if (players[id]) {
                scene.remove(players[id]);
                delete players[id];
            }
        });

        function addPlayer(id, data) {
            const geometry = new THREE.BoxGeometry(1, 1.6, 1);
            const material = new THREE.MeshPhongMaterial({ color: 0x0000FF });
            const player = new THREE.Mesh(geometry, material);
            player.position.set(data.x, data.y, data.z);
            scene.add(player);
            players[id] = player;
        }

        const keys = { w: false, a: false, s: false, d: false, space: false };
        const speed = 0.1;
        const gravity = -0.02;
        let velocityY = 0;
        let isOnGround = true;

        function handleKeyDown(event) {
            keys[event.key.toLowerCase()] = true;
        }

        function handleKeyUp(event) {
            keys[event.key.toLowerCase()] = false;
        }

        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);

        const lookSpeed = 0.002;
        let isPointerLocked = false;

        canvas.addEventListener('click', () => {
            canvas.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === canvas;
        });

        document.addEventListener('mousemove', (event) => {
            if (isPointerLocked) {
                cameraHolder.rotation.y -= event.movementX * lookSpeed;
                camera.rotation.x -= event.movementY * lookSpeed;
                camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
            }
        });

        function updateMovement() {
            const forward = new THREE.Vector3(
                -Math.sin(cameraHolder.rotation.y),
                0,
                -Math.cos(cameraHolder.rotation.y)
            ).normalize();

            const right = new THREE.Vector3(
                Math.cos(cameraHolder.rotation.y),
                0,
                -Math.sin(cameraHolder.rotation.y)
            ).normalize();

            if (keys.w) cameraHolder.position.addScaledVector(forward, speed);
            if (keys.s) cameraHolder.position.addScaledVector(forward, -speed);
            if (keys.a) cameraHolder.position.addScaledVector(right, -speed);
            if (keys.d) cameraHolder.position.addScaledVector(right, speed);

            if (isOnGround && keys.space) {
                velocityY = 0.3;
                isOnGround = false;
            }

            velocityY += gravity;
            cameraHolder.position.y += velocityY;

            if (cameraHolder.position.y <= 1.6) {
                cameraHolder.position.y = 1.6;
                isOnGround = true;
                velocityY = 0;
            }

            socket.emit('update-position', {
                x: cameraHolder.position.x,
                y: cameraHolder.position.y,
                z: cameraHolder.position.z,
                rotationY: cameraHolder.rotation.y
            });
        }

        function animate() {
            updateMovement();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        function startGame() {
            menu.style.display = 'none';
            animate();
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
